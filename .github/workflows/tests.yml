name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu . pytest scipy "jax>=0.11.2,<0.12"
          cd /tmp && python -c "import ilmlip; print(ilmlip.__version__, ilmlip.__file__)"
      - name: core tests
        run: >
          pytest -q -p no:cacheprovider -rfEs
          tests/test_model.py tests/test_products.py tests/test_data.py tests/test_dedup.py tests/test_docs.py
          tests/test_whitening.py tests/test_bounds.py tests/test_cpu.py tests/test_switches.py tests/test_train.py
